<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eliava Travel Ops | Back soon</title>
<meta name="description" content="Eliava Travel Ops is building a new site. We are still working. Email hello@eliavatravel.com.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #F5F8F9; --surface: #FFFFFF; --ink: #0E1D2B; --ink-soft: #465A6B;
    --accent: #0B5F70; --accent-hover: #094F5D; --sea: #DCEEF0; --sand: #F1ECE2; --brown: #43301F;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%; display: grid; place-items: center; padding: 32px 16px;
    background: var(--canvas); color: var(--ink);
    font: 400 1.125rem/1.6 "Albert Sans", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  .lockup { display: inline-flex; flex-direction: column; align-items: center; color: var(--brown); text-decoration: none; }
  .word { font: 400 clamp(3.4rem, 12vw, 5rem)/0.9 "Italiana", Georgia, serif; letter-spacing: 0.01em; }
  .sub { margin-top: 10px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase; padding-left: 0.42em; }

  .scene { width: 100%; max-width: 340px; margin: 28px auto 8px; display: block; }
  .rope { stroke: var(--ink-soft); stroke-width: 1.5; }
  .load { animation: lower 5.5s ease-in-out infinite; transform-box: view-box; }
  .flag { animation: wave 1.6s ease-in-out infinite; transform-origin: 236px 34px; transform-box: view-box; }
  @keyframes lower {
    0%, 12%   { transform: translateY(0); }
    45%, 62%  { transform: translateY(54px); }
    92%, 100% { transform: translateY(0); }
  }
  @keyframes wave { 50% { transform: skewY(-8deg) scaleX(0.9); } }

  h1 { font: 400 clamp(2.2rem, 7vw, 3rem)/1.1 "Italiana", Georgia, serif; margin-top: 8px; }
  p.lead { color: var(--ink-soft); margin-top: 12px; }
  .btn {
    display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 999px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  footer { margin-top: 36px; font-size: 0.875rem; color: var(--ink-soft); }
  footer a { color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { .load, .flag { animation: none; } }
</style>
</head>
<body>
<main>
  <a class="lockup" href="/" aria-label="Eliava Travel Ops">
    <span class="word">Eliava</span><span class="sub">Travel Ops</span>
  </a>

  <svg class="scene" viewBox="0 0 340 190" role="img" aria-label="A small crane lowering a suitcase onto a stack of blocks">
    <!-- ground -->
    <line x1="10" y1="178" x2="330" y2="178" stroke="#C9D6DC" stroke-width="2"/>
    <!-- crane mast -->
    <g fill="none" stroke="#0E1D2B" stroke-width="2.5" stroke-linejoin="round">
      <path d="M60 178 V40 M76 178 V40"/>
      <path d="M60 170 L76 150 L60 130 L76 110 L60 90 L76 70 L60 50"/>
      <path d="M40 40 H260 M68 40 L68 22 L250 40"/>
      <path d="M40 40 v10 h18 v-10"/>
    </g>
    <rect x="34" y="48" width="26" height="14" rx="2" fill="#0E1D2B"/>
    <!-- little flag -->
    <path class="flag" d="M236 34 v-20 l18 6 l-18 6" fill="#0B5F70"/>
    <line x1="236" y1="40" x2="236" y2="14" stroke="#0E1D2B" stroke-width="2"/>
    <!-- trolley -->
    <rect x="182" y="40" width="16" height="6" rx="1" fill="#465A6B"/>
    <!-- moving load: rope + hook + suitcase -->
    <g class="load">
      <line class="rope" x1="190" y1="46" x2="190" y2="64"/>
      <path d="M186 64 h8 M190 64 v4 a4 4 0 1 1 -4 4" fill="none" stroke="#0E1D2B" stroke-width="2"/>
      <line class="rope" x1="190" y1="72" x2="176" y2="82"/>
      <line class="rope" x1="190" y1="72" x2="204" y2="82"/>
      <rect x="183" y="78" width="14" height="6" rx="2" fill="none" stroke="#43301F" stroke-width="2"/>
      <rect x="168" y="82" width="44" height="30" rx="5" fill="#0B5F70"/>
      <rect x="168" y="94" width="44" height="4" fill="#094F5D"/>
      <circle cx="176" cy="113" r="2.5" fill="#0E1D2B"/><circle cx="204" cy="113" r="2.5" fill="#0E1D2B"/>
    </g>
    <!-- stack of blocks (the new site) -->
    <rect x="148" y="150" width="84" height="28" rx="3" fill="#F1ECE2" stroke="#43301F" stroke-width="1.5"/>
    <rect x="248" y="150" width="60" height="28" rx="3" fill="#DCEEF0" stroke="#0B5F70" stroke-width="1.5"/>
    <rect x="258" y="122" width="40" height="28" rx="3" fill="#F1ECE2" stroke="#43301F" stroke-width="1.5"/>
    <!-- cone -->
    <path d="M110 178 l9 -26 l9 26 z" fill="#0B5F70"/>
    <rect x="106" y="175" width="26" height="4" rx="1" fill="#0E1D2B"/>
    <path d="M114 166 h10" stroke="#fff" stroke-width="3"/>
  </svg>

  <h1>Excuse our dust.</h1>
  <p class="lead">We are building a new home for Eliava Travel Ops. The site is down for a short while. The work is not. We are still helping travel advisors every day.</p>
  <a class="btn" href="mailto:hello@eliavatravel.com">Email hello@eliavatravel.com</a>

  <footer>
    Current client? <a href="https://billing.stripe.com/p/login/eVq3cw1K91OXcVY1no1gs00">Client billing portal</a>
    <br>Eliava Consulting, LLC
  </footer>
</main>
</body>
</html>
